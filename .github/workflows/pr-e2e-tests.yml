name: E2E Tests on Pull Request

on:
  pull_request:
    branches:
      - master

jobs:
  e2e_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout parent repo with submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Start application
        run: |
          chmod +x start.sh
          ./start.sh

      - name: Run e2e tests
        run: |
          chmod +x run-e2e-tests.sh
          ./run-e2e-tests.sh

      - name: Stop application
        if: always()
        run: |
          chmod +x stop.sh
          ./stop.sh

