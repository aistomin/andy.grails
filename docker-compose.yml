# Shared log rotation: every container keeps at most 3 x 10 MB of logs so a
# chatty service cannot fill the disk of a small server.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  # Database
  db:
    image: postgres:18
    container_name: andy_grails_db
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      POSTGRES_DB: ${DB_NAME:-andy_grails}
      POSTGRES_USER: ${DB_USER:-andy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-andy}
    ports:
      - '55432:5432'
    volumes:
      - andy_grails_postgres:/var/lib/postgresql
    healthcheck:
      # -h localhost forces TCP: the temporary server the image runs during
      # initdb listens on the Unix socket only, so it must not count as ready.
      test: ['CMD', 'pg_isready', '-U', '${DB_USER:-andy}', '-d', '${DB_NAME:-andy_grails}', '-h', 'localhost']
      interval: 5s
      retries: 10
    networks:
      - andy-network

  # Backend API
  backend:
    image: andygrails/andy-grails-backend:${BACKEND_REVISION:-latest}
    platform: linux/amd64
    container_name: andy_grails_backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8080:8080'
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-andy_grails}
      DB_USER: ${DB_USER:-andy}
      DB_PASSWORD: ${DB_PASSWORD:-andy}
      # Let the JVM heap follow the container limit above (the JDK default is
      # 25%, which leaves Spring Boot with only 256 MB heap out of 1 GB).
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/actuator/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - andy-network

  # Frontend Angular App
  frontend:
    image: andygrails/andy-grails-frontend:${FRONTEND_REVISION:-latest}
    platform: linux/amd64
    container_name: andy_grails_frontend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64m
    ports:
      - '4200:80'
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
    networks:
      - andy-network

volumes:
  andy_grails_postgres:

networks:
  andy-network:
    driver: bridge
